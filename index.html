<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lara: Gölgelerden Zirveye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Arka Plan -->
        <div id="bg-layer"></div>
        
        <!-- Karakterler -->
        <div id="character-layer">
            <img id="char-sprite" src="" alt="Karakter" style="display: none;">
        </div>
        
        <!-- Anksiyete Barı HUD -->
        <div id="anxiety-hud">
            <div class="anxiety-label">Anksiyete (Panik Seviyesi): <span id="anxiety-value">20</span>/100</div>
            <div class="anxiety-bar-bg">
                <div id="anxiety-bar-fill"></div>
            </div>
        </div>

        <!-- UI Katmanı -->
        <div id="ui-layer">
            <div id="dialogue-box">
                <div id="speaker-name">İsim</div>
                <div id="dialogue-text">Metin buraya gelecek...</div>
                <div id="next-indicator">▼</div>
            </div>
            
            <div id="choices-container" style="display: none;">
                <!-- Seçenekler buraya eklenecek -->
            </div>
        </div>
        
        <!-- Başlangıç Ekranı -->
        <div id="start-screen">
            <div class="overlay"></div>
            <div class="content">
                <h1 class="title-glow">Lara: Gölgelerden Zirveye</h1>
                <p class="subtitle">Her seçim bir yara, her yara bir hikaye...</p>
                <div class="menu-buttons">
                    <button id="start-btn" class="main-btn">Hikayeye Başla</button>
                    <button id="credits-btn" class="secondary-btn">Yapımcılar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/script.js"></script>
</body>
</html>
